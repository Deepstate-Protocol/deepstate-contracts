[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc = "0.8.28"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = true

[invariant]
runs = 256
depth = 64
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
