name: Verify

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      deep:
        description: Run the deep invariant profile.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Static and Build Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: nightly-d3167db683c001c196126c912027437a9cb0bfb9

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.29

      - name: Verification Toolchain Lock
        run: make toolchain-lock-check

      - name: Formatting
        run: make fmt

      - name: Lint
        run: make lint

      - name: Independent Tick Reference
        run: make tick-reference

      - name: Build Size
        run: make build-size

      - name: Slither
        run: make slither

  tests:
    name: Behavioral Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: nightly-d3167db683c001c196126c912027437a9cb0bfb9

      - name: Forge Tests
        run: make test

  invariants:
    name: Invariants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
      RUN_DEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.deep }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: nightly-d3167db683c001c196126c912027437a9cb0bfb9

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"

      - name: Stateful Invariants
        env:
          INVARIANT_SHARD: ${{ matrix.shard }}
        run: |
          runs=256
          if [[ "$RUN_DEEP" == "true" ]]; then
            runs=2048
          fi
          make invariant-deep-shard \
            INVARIANT_RUNS="$runs" \
            INVARIANT_DEPTH=64 \
            INVARIANT_SHARDS=8 \
            INVARIANT_SHARD="$INVARIANT_SHARD"

  snapshots:
    name: Runtime Snapshot (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            contract: RadixMatchingEngineGasTest
          - label: hooks
            contract: RadixMatchingEngineHookGasTest
          - label: fees
            contract: RadixMatchingEngineFeeGasTest
          - label: integrator-fees
            contract: DeepstateV1IntegratorFeeGasTest
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: nightly-d3167db683c001c196126c912027437a9cb0bfb9

      - name: Check Runtime Snapshot
        env:
          GAS_CONTRACT: ${{ matrix.contract }}
        run: make snapshot-runtime-check GAS_CONTRACTS="$GAS_CONTRACT"

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: nightly-d3167db683c001c196126c912027437a9cb0bfb9

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"

      - name: Forge Coverage
        run: make coverage-check

  formal:
    name: Halmos Formal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: nightly-d3167db683c001c196126c912027437a9cb0bfb9

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.29

      - name: Halmos Formal
        run: make formal-halmos

  smt:
    name: SMT Formal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.29

      - name: SMT Formal
        run: make formal-smt

  verify:
    name: Verify
    if: ${{ always() }}
    needs:
      - quality
      - tests
      - invariants
      - snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Successful Verification Jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          INVARIANTS_RESULT: ${{ needs.invariants.result }}
          SNAPSHOTS_RESULT: ${{ needs.snapshots.result }}
        run: |
          printf 'quality=%s tests=%s invariants=%s snapshots=%s\n' \
            "$QUALITY_RESULT" "$TESTS_RESULT" "$INVARIANTS_RESULT" "$SNAPSHOTS_RESULT"
          [[ "$QUALITY_RESULT" == "success" ]]
          [[ "$TESTS_RESULT" == "success" ]]
          [[ "$INVARIANTS_RESULT" == "success" ]]
          [[ "$SNAPSHOTS_RESULT" == "success" ]]

  security:
    name: Coverage and Formal
    if: ${{ always() }}
    needs:
      - quality
      - coverage
      - formal
      - smt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Successful Security Jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          SMT_RESULT: ${{ needs.smt.result }}
        run: |
          printf 'quality=%s coverage=%s formal=%s smt=%s\n' \
            "$QUALITY_RESULT" "$COVERAGE_RESULT" "$FORMAL_RESULT" "$SMT_RESULT"
          [[ "$QUALITY_RESULT" == "success" ]]
          [[ "$COVERAGE_RESULT" == "success" ]]
          [[ "$FORMAL_RESULT" == "success" ]]
          [[ "$SMT_RESULT" == "success" ]]
